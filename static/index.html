<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智能学习伴侣 | AI学习路径规划</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="app">
        <!-- 左侧边栏 -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <div class="logo">
                    <div class="logo-icon">学</div>
                    <div class="logo-text">
                        <div class="logo-title">智能学习伴侣</div>
                        <div class="logo-sub">AI个性化学习规划</div>
                    </div>
                </div>
            </div>
            <button class="new-chat-btn" onclick="newConversation()">+ 新建对话</button>
            <div class="conv-list-title">历史对话</div>
            <div class="conv-list" id="convList"></div>
            <div class="sidebar-footer">
                <div class="api-status" id="apiStatus">
                    <span class="status-dot"></span>
                    <span id="apiStatusText">检查中...</span>
                </div>
            </div>
        </aside>

        <!-- 主区域 -->
        <main class="main">
            <!-- 聊天区域 -->
            <div class="chat-area" id="chatArea">
                <div class="chat-header" id="chatHeader">
                    <div class="chat-title" id="chatTitle">智能学习伴侣</div>
                    <div class="chat-subtitle" id="chatSubtitle">输入你的学习目标，AI为你规划</div>
                </div>
                <div class="messages" id="messages"></div>
                <!-- 豆包风格正在输入提示 -->
                <div class="typing-row" id="typingIndicator" style="display:none;">
                    <div class="typing-avatar">学</div>
                    <div class="typing-bubble-doubao">
                        <span class="dot"></span>
                        <span class="dot"></span>
                        <span class="dot"></span>
                    </div>
                </div>
                <!-- 学情快速选择面板 -->
                <div class="quick-setup" id="quickSetup" style="display:none;">
                    <div class="quick-setup-title">完善信息，生成更精准的计划</div>
                    <div class="setup-group">
                        <div class="setup-label">你的基础</div>
                        <div class="setup-cards">
                            <div class="setup-card" onclick="selectSetup('base','零基础')">零基础</div>
                            <div class="setup-card" onclick="selectSetup('base','入门')">入门了解</div>
                            <div class="setup-card" onclick="selectSetup('base','有一定基础')">有一定基础</div>
                            <div class="setup-card" onclick="selectSetup('base','熟练')">熟练掌握</div>
                        </div>
                    </div>
                    <div class="setup-group">
                        <div class="setup-label">每天学习时长</div>
                        <div class="setup-cards">
                            <div class="setup-card" onclick="selectSetup('hours','0.5')">30分钟</div>
                            <div class="setup-card" onclick="selectSetup('hours','1')">1小时</div>
                            <div class="setup-card" onclick="selectSetup('hours','2')">2小时</div>
                            <div class="setup-card" onclick="selectSetup('hours','3')">3小时以上</div>
                        </div>
                    </div>
                    <div class="setup-actions">
                        <button class="setup-skip" onclick="skipSetup()">用默认设置直接开始</button>
                    </div>
                </div>
                <div class="welcome-screen" id="welcomeScreen">
                    <div class="welcome-icon">🎯</div>
                    <h2>选择一个目标，立刻开始</h2>
                    <p>点击下方模板一键生成，或直接输入你想学的内容</p>
                    <div class="template-grid">
                        <div class="template-card" onclick="sendExample('我想在1个月内学会Python数据分析')">
                            <div class="template-icon">🐍</div>
                            <div class="template-name">Python数据分析</div>
                            <div class="template-desc">1个月 · 零基础</div>
                        </div>
                        <div class="template-card" onclick="sendExample('我想7天速成前端开发')">
                            <div class="template-icon">🌐</div>
                            <div class="template-name">前端开发</div>
                            <div class="template-desc">7天 · 速成</div>
                        </div>
                        <div class="template-card" onclick="sendExample('我想备考考研数学')">
                            <div class="template-icon">📐</div>
                            <div class="template-name">考研数学</div>
                            <div class="template-desc">备考 · 系统复习</div>
                        </div>
                        <div class="template-card" onclick="sendExample('我想学会做PPT')">
                            <div class="template-icon">📊</div>
                            <div class="template-name">PPT制作</div>
                            <div class="template-desc">职场技能</div>
                        </div>
                        <div class="template-card" onclick="sendExample('我想学会视频剪辑')">
                            <div class="template-icon">🎬</div>
                            <div class="template-name">视频剪辑</div>
                            <div class="template-desc">自媒体必备</div>
                        </div>
                        <div class="template-card" onclick="sendExample('我想学会英语四级')">
                            <div class="template-icon">📚</div>
                            <div class="template-name">英语四级</div>
                            <div class="template-desc">考试 · 3个月</div>
                        </div>
                    </div>
                </div>
                <!-- 快捷操作栏 -->
                <div class="quick-actions" id="quickActions" style="display:none;">
                    <button class="quick-btn" onclick="quickAction('quiz')">出题测试</button>
                    <button class="quick-btn" onclick="quickAction('adjust')">调整计划</button>
                    <button class="quick-btn" onclick="quickAction('next')">下一步学什么</button>
                    <button class="quick-btn" onclick="quickAction('record')">记录学习</button>
                    <button class="quick-btn" onclick="quickAction('export')">导出日历</button>
                </div>
                <div class="input-area">
                    <div class="input-wrapper">
                        <button class="img-btn" onclick="document.getElementById('imgInput').click()" title="上传图片/拍照">📷</button>
                        <input type="file" id="imgInput" accept="image/*" capture="environment" style="display:none" onchange="handleImageUpload(event)">
                        <textarea id="userInput" placeholder="输入你的学习目标或进度反馈..." rows="1" onkeydown="handleKeyDown(event)"></textarea>
                        <button class="send-btn" onclick="sendMessage()" id="sendBtn">发送</button>
                    </div>
                    <div class="img-preview" id="imgPreview" style="display:none;">
                        <img id="previewImg" src="" alt="预览">
                        <button class="img-remove" onclick="removeImage()">×</button>
                    </div>
                    <div class="input-hint">按 Enter 发送，Shift+Enter 换行</div>
                </div>
            </div>

            <!-- 详情面板 -->
            <div class="detail-panel" id="detailPanel" style="display:none;">
                <div class="detail-tabs">
                    <button class="tab-btn active" data-tab="skilltree" onclick="switchTab('skilltree')">学习路线</button>
                    <button class="tab-btn" data-tab="resources" onclick="switchTab('resources')">学习资源</button>
                    <button class="tab-btn" data-tab="plan" onclick="switchTab('plan')">学习计划</button>
                    <button class="tab-btn" data-tab="quiz" onclick="switchTab('quiz')">测试记录</button>
                    <button class="tab-btn" data-tab="stats" onclick="switchTab('stats')">我的进度</button>
                </div>
                <div class="detail-content">
                    <div class="tab-pane active" id="tab-skilltree"></div>
                    <div class="tab-pane" id="tab-resources"></div>
                    <div class="tab-pane" id="tab-plan"></div>
                    <div class="tab-pane" id="tab-quiz"></div>
                    <div class="tab-pane" id="tab-stats"></div>
                </div>
            </div>
        </main>
    </div>

    <script src="/static/app.js"></script>
</body>
</html>
